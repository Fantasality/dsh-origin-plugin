; ============================================================
; App.ini —— Origin App 元数据（mkOPX 打包时必须带，否则拖进 Origin 不生效）
; 这是 DSH Origin Bridge 的打包描述文件；按钮点击后会执行同目录的 launch.ogs。
; 注意：mkOPX 对路径大小写/反斜杠敏感（见 README.md 的"常见坑"）。
; ============================================================
[App]
; Apps Gallery 里显示的按钮文字
Name = DSH Origin Bridge
; 鼠标悬停提示
Description = 一键启动/停止 Origin MCP 桥接（sidecar 后台进程），让 AI 客户端通过 MCP 驱动 Origin 画图
Author = dsh-origin-plugin
Web = https://github.com/your-org/dsh-origin-plugin
; 入口脚本类型：本 App 用 OGS 作为按钮处理入口
Type = OGS
; 主脚本文件名（按钮点击时执行它的 [Main] 段）
MainFile = launch.ogs
