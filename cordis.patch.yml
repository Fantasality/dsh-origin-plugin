# dsh-origin-plugin — DeepSeek Harness × Origin 绘图（bundle 层，v2.0.4 同步传输版）
#
# 通过 DSH 官方 @deepseek-ai/dsh-mcp-client 把本仓库的 Python MCP server
# （origin_mcp_server.py，stdio）注册为原生工具：
#   mcp__origin__origin_plot_file / origin_write_data / origin_plot /
#   origin_export / origin_status / ...（共 28 个工具）
#
# ── v2.0.2 市场适配要点 ──
# ▸ 路径自定位：server 的绝对路径由 !!js 在启动时按
#     <DSH_HOME>/profiles/web/node_modules/dsh-origin-plugin/ 计算；
#   DSH_HOME 缺省回退到 %USERPROFILE%/.dsh。不再依赖进程工作目录，
#   修复 2.0.1 及更早版本"python: can't open file ... origin_mcp_server.py"
#   （旧版相对路径会解析到 DSH 可执行目录而非插件目录，导致工具永不注册）。
# ▸ 启动安全：failOnStartupError: false —— server 连不上只记日志、不注册工具，
#   绝不让 DSH 启动失败或挂起（插件市场安装适配的核心目标：装上不坏 DSH）。
# ▸ 单条目防冲突：本层只插入**一个** mcp-origin。切勿在 profile 里再加一条
#   完整同名条目（例如 2.0.1 版 register_to_dsh.ps1 生成的完整 insert），
#   否则 DSH 会以 "duplicate loader entry id: mcp-origin" 直接启动失败。
#   覆盖时请用「config-only 覆盖」（见下）。
#
# ── v2.0.4 同步传输要点（修复 60s boot 挂起） ──
# ▸ 服务器 stdio 传输改为纯同步 JSON-RPC 循环（origin_mcp_server.py 的
#   _sync_stdio_server()），不再走 mcp 2.0.0 的 anyio.run →
#   asyncio.ProactorEventLoop。后者 _make_self_pipe 用 _socket.socketpair()
#   fallback（127.0.0.1 listen+connect+accept），在防火墙/安全软件屏蔽回环
#   accept 的环境下永久阻塞 → 事件循环建不起来 → 服务器永不响应 initialize →
#   MCP SDK 60s 超时(DEFAULT_REQUEST_TIMEOUT_MSEC) → DSH boot 挂 60s →
#   desktop guard 回滚。同步循环用 sys.stdin.readline + sys.stdout.buffer.flush，
#   毫秒级握手，零事件循环/回环依赖。28 个工具函数不变（功能零影响）。
# ▸ args 加 -u + env 加 PYTHONUNBUFFERED=1：双重保险，确保 stdout 即时 flush
#   （同步循环已显式 flush，此为兜底防任何 stray print 缓冲）。
#
# 前置要求（详见 README「快速开始」）：
#   · Windows + 已安装 Origin（实测 OriginPro 2026b，2018+ 一般均可）
#   · Python 3.10+，并按 README 创建 venv 安装依赖：
#       python -m venv "%USERPROFILE%\dsh_origin_plugin\.venv"
#       "%USERPROFILE%\dsh_origin_plugin\.venv\Scripts\python.exe" -m pip install -r requirements.txt
#
# 覆盖说明（可选）：
#   · 默认 command = 系统 PATH 中的 python。若依赖装在独立 venv（推荐），在
#     profile 的 cordis.patch.yml 里用**同一 id + config-only** 覆盖 command/args。
#     覆盖会**整体替换** config，因此必须带上 serverName/transport 等完整字段：
#         - id: mcp-origin
#           config:
#             serverName: origin
#             transport: stdio
#             command: C:/Users/<你>/dsh_origin_plugin/.venv/Scripts/python.exe
#             args: [-u, -X, utf8, C:/Users/<你>/.dsh/profiles/web/node_modules/dsh-origin-plugin/origin_mcp_server.py]
#             env:
#               PYTHONIOENCODING: utf-8
#               PYTHONUNBUFFERED: '1'
#             failOnStartupError: false
#             toolCallTimeoutMs: 120000
#     （层级：bundle patch → profile patch → $DSH_HOME/cordis.patch.yml，后层覆盖先层。）
#   · 若你的 DSH profile 不是默认的 web，把上面的 /profiles/web/ 换成你的 profile
#     名再覆盖（或直接覆盖 args 里的完整路径）。
#   · 始终使用 config-only 覆盖（不带 name、不带 insert），避免与 bundle 层撞成
#     两条完整条目导致 duplicate loader entry id 启动失败。

- insert:
    - id: mcp-origin
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: origin
        transport: stdio
        command: python
        args:
          - '-u'
          - '-X'
          - utf8
          - !!js (process.env.DSH_HOME || (String(process.env.USERPROFILE) + '/.dsh')) + '/profiles/web/node_modules/dsh-origin-plugin/origin_mcp_server.py'
        cwd: !!js (process.env.DSH_HOME || (String(process.env.USERPROFILE) + '/.dsh')) + '/profiles/web/node_modules/dsh-origin-plugin'
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 120000
    # Self-mount: a no-op fiber so the plugin market reads this bundle as
    # "live/active" (verify.js liveIncludes checks for the package name in the
    # loader entry-name set). Without this row the only entry name is
    # @deepseek-ai/dsh-mcp-client, so liveIncludes('dsh-origin-plugin')=false
    # and the market perpetually shows "restart to apply" even after restart.
    # apply() in index.js is a no-op; the real tools come from mcp-origin above.
    - id: dsh-origin-plugin
      name: dsh-origin-plugin
